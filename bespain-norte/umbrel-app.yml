releaseNotes: >-
  Las copias de seguridad ya no se quedan solo dentro del Umbrel: Norte las
  lleva también a un disco externo, y también solo.

  Para activarlo: conecta un disco al Umbrel, móntalo bajo /media, crea dentro
  una carpeta llamada "norte-copias" y reinicia Norte. A partir de ahí, cada
  copia sale al disco en cuanto se hace; si el disco estaba desconectado, las
  pendientes salen en cuanto vuelve.

  Esa carpeta "norte-copias" es obligatoria a propósito. Es lo único que
  distingue un disco conectado de un disco que no está, y evita que las copias
  acaben llenando el disco del propio Umbrel. También sirve de permiso: Norte
  solo escribe en discos que tú has marcado.

  Del disco externo no se borra nada nunca. La rotación (siete diarias y doce
  mensuales) se aplica dentro del Umbrel; fuera se va acumulando el archivo.

  El estado del disco se ve en la pantalla de inicio, junto al de las copias: si
  lleva días sin aparecer, te lo dice. Ten en cuenta que un disco enchufado al
  Umbrel protege de que se estropee el disco interno, no de un robo o un
  incendio: para eso hace falta una copia fuera de casa.

