releaseNotes: >-
  La pantalla de inicio pasa a ser el cuadro de mando. Arriba, en grande, tu
  patrimonio neto: todo lo que tienes menos todo lo que debes, con cuánto ha
  cambiado desde el mes pasado y un gráfico con su evolución mes a mes. La
  primera foto se guarda al entrar; a partir de ahí, cada mes se añade sola.

  Debajo, los próximos 30 días: con los recibos previstos, las cuotas de tus
  deudas y los pagos de tarjeta, Norte dibuja adónde va el saldo y te dice cuál
  será el día más apretado del mes y con cuánto. Solo cuenta lo que ya está
  comprometido — no se inventa lo que "sueles gastar", porque esa línea se
  cumple en la pantalla y nunca en el banco.

  Y una lista con lo que viene: los próximos recibos y cuotas, cada uno con su
  fecha y su importe, para que ninguno te pille de sorpresa.

  Los gráficos se pueden recorrer con el dedo, el ratón o el teclado, y debajo
  de cada uno están los datos en tabla, por si prefieres los números.

