releaseNotes: >-
  Norte ya hace copias de seguridad solas, una al día a las 04:30, sin que
  tengas que acordarte de nada ni añadir tareas al servidor.

  Cada copia lleva la base de datos entera y los documentos que hayas subido, y
  se comprueba antes de darse por buena: un fichero a medias no llega a
  parecerse a una copia. Se guardan las siete últimas diarias y la más reciente
  de cada uno de los doce últimos meses; las viejas se borran solas.

  Lo importante está en la pantalla de inicio: ahí ves si las copias van al día,
  cuándo fue la última y cuánto ocupa, con un botón para hacer una copia en el
  momento. Si el servicio se para o una copia falla, te lo dice en esa misma
  pantalla. Una copia que falla en silencio es peor que no tener copias.

  Recuerda que las copias viven en el mismo Umbrel: protegen de un borrado o de
  una actualización que salga mal, no de que se estropee el disco. De vez en
  cuando conviene llevarse la carpeta a otro sitio.

  También sigue disponible lo de la versión anterior: la pestaña Documentos
  para subir extractos del banco (Norma 43, Excel, CSV o PDF) y nóminas, con
  revisión antes de importar nada y sin duplicar lo que ya tenías.

