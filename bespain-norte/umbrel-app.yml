releaseNotes: >-
  Nueva pestaña: Deudas y tarjetas. Metes tu hipoteca o tu préstamo y Norte
  calcula el cuadro entero, lo que llevas devuelto y lo que te queda.

  Lo importante es el simulador de amortización anticipada. Pones cuánto quieres
  meter y te enseña las DOS opciones una al lado de la otra: reducir plazo
  (misma cuota, acabas antes) y reducir cuota (pagas menos cada mes, acabas
  igual), con el ahorro de cada una. Y la comisión de tu contrato se resta del
  ahorro, no se esconde: un simulador que enseña «te ahorras 8.400 €» y calla
  los 500 € de comisión no te está informando.

  Con varias deudas, compara avalancha (primero el tipo más alto, la que menos
  intereses paga) y bola de nieve (primero la más pequeña, que paga algo más
  pero se hace más llevadera), y te dice la diferencia exacta en euros y en
  meses. La decisión es tuya.

  De las tarjetas verás el dato que casi ninguna app enseña: cuántos días de
  financiación gratis te quedan si compras hoy. Y hay una calculadora de lo que
  cuesta aplazar: 3.000 € al 24 % pagando el mínimo del 3 % son 159 meses y
  7.436 € en total. Si la cuota no cubre ni los intereses, te dice que esa deuda
  no se acaba nunca y cuánto haría falta para que empiece a bajar.

  Todas las cifras están comprobadas contra cálculos hechos aparte con precisión
  decimal exacta, no contra el propio programa.

