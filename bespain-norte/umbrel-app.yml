releaseNotes: >-
  Gastos compartidos. Marca un gasto como compartido y Norte te dice, en una
  frase y en grande, quién le tiene que pasar cuánto a quién. Quien pagó sale
  de la cuenta de la que salió el dinero: no hay ningún campo que rellenar y
  que se olvide.

  Puedes repartir a partes iguales, por porcentajes, con un importe fijo
  («yo pongo 400 € de la casa y el resto lo pones tú») o en proporción a lo que
  ingresa cada uno, que es lo que la gente quiere de verdad cuando los sueldos
  son distintos. En ese caso la pantalla te enseña con qué ingresos ha
  repartido, mes a mes: repartir según los ingresos sin enseñarlos es pedir que
  alguien se fíe de una cifra que no puede comprobar.

  Cuando cerráis cuentas, Norte calcula las transferencias mínimas de verdad,
  buscando los grupos que ya se saldan entre ellos. En muchos casos es una
  transferencia menos que la que propone cualquier otra app. El cierre se
  guarda con su fecha y sus pagos, y si después aparece un ticket con fecha
  vieja te avisa en vez de tragárselo.

  Un gasto pagado desde una cuenta privada entra en la cuenta común —el otro
  necesita ver el concepto y el importe para estar de acuerdo— pero Norte no
  dice de qué cuenta salió.

  Y si el espacio es un negocio, cada socio tiene su cuenta corriente con la
  sociedad: lo aportado, lo retirado, lo que le toca del resultado según su
  participación y lo que ya ha cobrado.

