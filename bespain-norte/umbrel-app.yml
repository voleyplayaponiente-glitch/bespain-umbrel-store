releaseNotes: >-
  Norte ya no se deja engañar con el disco externo. Si creas la carpeta
  "norte-copias" en un sitio que parece un disco pero en realidad es el disco
  del propio Umbrel —pasa si el disco no llegó a montarse—, no copia nada y te
  lo dice en la pantalla de inicio. Antes habría anunciado "copia en el disco
  externo" mientras copiaba sobre el mismo disco que intenta proteger.

  Cómo preparar el disco, con el orden correcto: conecta el disco, comprueba con
  "lsblk" que aparece, móntalo bajo /media, y SOLO ENTONCES crea dentro la
  carpeta "norte-copias". Después reinicia Norte.

  Sigue todo lo demás: copia diaria a las 04:30 comprobada antes de darse por
  buena, siete diarias y doce mensuales, la segunda copia al disco externo, y el
  botón para hacer una copia en el momento.

