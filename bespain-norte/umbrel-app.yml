releaseNotes: >-
  Norte 1.0. Con esta versión está terminado todo lo que se planeó: cuentas y
  movimientos, lectura de extractos y nóminas, presupuesto por sobres, deudas y
  tarjetas, inversiones, el cuadro de mando, gastos compartidos y, ahora,
  exportación, informes y licencias.

  Nueva pestaña Ajustes. Desde ahí te llevas todo lo tuyo en un clic, en JSON o
  en CSV: exportar funciona siempre, también sin licencia y también si tu cuenta
  estuviera en solo lectura. Tus datos son tuyos y Norte no necesita el permiso
  de nadie para dártelos.

  Informe mensual imprimible: los cuatro números del mes, en qué se ha ido el
  dinero y dónde estás. El PDF lo genera tu propio navegador, y sale siempre en
  claro aunque uses el modo oscuro.

  Licencias para quien quiera vender Norte o instalarlo para más gente. Una
  persona usa Norte entero y gratis, siempre; la licencia abre el cupo para
  compartirlo. Se comprueba dentro de tu servidor, sin conexión y sin llamar a
  ninguna parte. Y si caduca no se borra ni se bloquea nada: el cupo vuelve a
  una persona y quien sobre puede seguir consultando y exportándolo todo. Quien
  ya estaba usando su instalación antes de esta versión no cuenta para el cupo,
  nunca.

  Accesibilidad revisada a fondo con herramientas de auditoría: los grises
  secundarios y el botón principal en modo oscuro no llegaban al contraste
  mínimo y ahora sí, en todas las pantallas y en los dos temas.

  Y una página nueva de aviso legal y privacidad, con lo que hay que decir
  claro: Norte no mueve dinero, no se conecta a tu banco, no da asesoramiento
  de inversión ni fiscal, y sus informes no son documentos contables.

