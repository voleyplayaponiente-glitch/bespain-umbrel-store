description: >-
  Tu dinero, en una pantalla. Norte lleva el control del presupuesto personal y
  el compartido: cuentas, movimientos, presupuesto por sobres, deudas con su
  cuadro de amortización, tarjetas de crédito por ciclo, inversiones y la
  evolución del patrimonio neto, que es la cifra que de verdad manda.

  A diferencia de las otras dos aplicaciones, Norte **no guarda nada en el
  navegador**: los datos viven en una base de datos PostgreSQL dentro de tu
  Umbrel. Limpiar el navegador, cambiar de móvil o entrar desde otro equipo no
  pierde nada.

  El registro está cerrado por diseño: la primera cuenta que se crea es la del
  dueño de la instalación y a partir de ahí solo se entra con un enlace de
  invitación, que vale una sola vez y caduca a los siete días. En un espacio
  compartido, cada uno mantiene su espacio personal invisible para el otro.
