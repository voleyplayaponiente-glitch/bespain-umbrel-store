releaseNotes: >-
  Arreglo importante: en la versión anterior el contenedor de las copias
  arrancaba y se apagaba en el acto sin hacer nada ni dejar rastro, así que las
  copias de seguridad NO se estaban haciendo. Si vienes de la 0.4.1 o la 0.4.2,
  actualiza.

  La causa: el guion de copias venía como fichero suelto de la app, y Umbrel
  solo copia el docker-compose y la ficha. Ahora viaja dentro de su propia
  imagen, que es lo que sí se actualiza solo.

  La app avisaba de ello en la pantalla de inicio, en rojo y con todas las
  letras, que es justo para lo que está esa tarjeta: una copia que falla en
  silencio es peor que no tener copias.

  Con esto queda funcionando todo lo de las dos versiones anteriores: copia
  diaria a las 04:30 comprobada antes de darse por buena, siete diarias y doce
  mensuales, copia al disco externo si le pones una carpeta «norte-copias», y
  un botón para hacer una copia en el momento.

