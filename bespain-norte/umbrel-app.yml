releaseNotes: >-
  Nueva pestaña: Inversiones. Apuntas lo que compras, lo que vendes y los
  dividendos, pones el precio de vez en cuando y Norte calcula el coste medio,
  lo que llevas ganado sin vender y tu rentabilidad real.

  La rentabilidad es una TIR: tiene en cuenta cuándo metiste cada euro, no solo
  cuánto. Si todavía no se puede calcular —porque solo has aportado y aún no has
  valorado la cartera— dice que no se puede, en vez de enseñarte un cero. Para
  comparar con un índice hace falta otra rentabilidad, la ponderada por tiempo,
  que necesita valoraciones periódicas: Norte aún no las guarda y te lo dice en
  la propia pantalla en lugar de darte un número que parece comparable.

  Puedes fijar tu asignación objetivo (por ejemplo 70 % variable, 25 % fija,
  5 % monetario) y Norte avisa cuando la cartera se desvía más de 5 puntos, con
  cuánto habría que mover para volver. Cinco PUNTOS, no un 5 % relativo:
  rebalancear por cualquier desvío pequeño solo genera comisiones e impuestos.

  Los precios los pones tú: Norte no llama a ninguna web de cotizaciones. Cada
  precio se guarda con su fecha, y si lleva más de dos meses sin actualizar te
  lo marca — un precio sin fecha parece de hoy aunque sea de hace medio año.

  Un aviso que verás si vendes con ganancia: el coste medio es lo que enseña tu
  bróker, pero Hacienda liquida acciones y fondos por FIFO, así que para la
  declaración la cifra puede no ser esa.

