releaseNotes: >-
  Norte 1.0.1. Revisión de seguridad a fondo.

  Se han reforzado los lectores de extractos y hojas de cálculo contra ficheros
  preparados para agotar la memoria del servidor (un Excel de pocos kilobytes
  que al abrirse se expande a gigas): ahora se cortan en vez de intentar
  procesarlos, y Norte sigue en pie.

  La exportación a CSV ya no deja pasar conceptos que empiezan por «=» como
  fórmulas: en un espacio compartido, alguien podía escribir un concepto que se
  ejecutara en el Excel de otra persona al abrir su exportación. Ahora se tratan
  siempre como texto.

  Y la web ahora manda las cabeceras de seguridad que se esperan de una app de
  finanzas: bloqueo de scripts externos, de que te metan en un iframe y de que
  el navegador adivine tipos de contenido. Comprobado sirviendo la aplicación de
  verdad, sin que rompa nada.

  Nada de esto cambia lo que ves ni toca tus datos. Es una actualización que
  solo cierra puertas.

