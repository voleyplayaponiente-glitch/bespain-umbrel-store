releaseNotes: >-
  Nueva pestaña: Presupuesto. Repartes el mes en sobres y cada euro que esperas
  ingresar tiene un trabajo asignado. La cifra grande de arriba es lo que te
  queda sin repartir: mientras no sea cero, hay dinero suelto.

  Cada barra lleva una marca con el día del mes, así que no ves solo cuánto
  llevas gastado sino si vas adelantado. Y cada sobre te dice cuánto puedes
  gastar al día con lo que queda, descontando los recibos que aún no han pasado:
  un sobre con 750 € y el alquiler a punto de salir no tiene 750 € libres.

  Puedes marcar los sobres que arrastran: lo que sobra pasa al mes siguiente, y
  lo que te has pasado también. Al cerrar el mes se aplica de una vez.

  El botón "Proponer con mi gasto real" rellena el presupuesto mirando lo que
  gastaste de verdad: la mediana de los últimos seis meses en lo variable y el
  último mes en los recibos fijos. Usa la mediana a propósito, para que la
  revisión del coche de marzo no se convierta en tu presupuesto de transporte de
  todos los meses.

  Ojo con una cosa: los ingresos solo cuentan si están clasificados en una
  categoría de ingreso. Es deliberado — un traspaso entre dos cuentas tuyas
  también entra como apunte positivo, y sumarlo daría un presupuesto con dinero
  que no existe.

