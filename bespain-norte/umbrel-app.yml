releaseNotes: >-
  Ya no hace falta teclear los movimientos uno a uno. La pestaña Documentos es
  un buzón: sueltas ahí el extracto del banco o la nómina y Norte los lee.

  Entiende el fichero Norma 43 (.q43) que dan casi todos los bancos españoles,
  los Excel (.xlsx y los .xls antiguos), los CSV y los PDF con texto. Si tu
  banco te deja elegir, baja el .q43: es el único formato en el que no hay que
  adivinar nada.

  Nada entra en tus cuentas sin que lo veas. Norte te enseña lo que ha
  entendido —fecha, concepto e importe de cada movimiento— y tú marcas lo que
  quieres importar. Lo que ya tenías aparece señalado y no se duplica, ni
  aunque subas el mismo mes dos veces o el mismo extracto en Excel y en PDF.

  De una nómina saca la empresa, el periodo, el bruto, la retención de IRPF, la
  Seguridad Social y el líquido, y propone el ingreso del líquido. Lo que no
  consigue leer lo deja en blanco y lo dice, en lugar de rellenarlo con un cero.

  Si un extracto trae el número de tarjeta completo dentro del concepto —los
  hay—, Norte lo guarda tapado: solo los cuatro últimos.

