releaseNotes: >-
  Primera versión en la tienda, ya utilizable en el día a día.

  Apuntar un gasto son tres toques: pulsa Ctrl+K (o Cmd+K) y escribe «café
  3,40 ayer». Entiende el importe, la fecha y si es ingreso o gasto, y si no
  encuentra el importe lo dice en vez de inventárselo.

  Incluye cuentas con su saldo, movimientos con filtros y búsqueda, y
  recurrentes (alquiler, nómina, suscripciones) que dejan movimientos
  previstos: aparecen en la lista pero no tocan el saldo hasta que confirmas
  que han pasado, para que el saldo siempre cuadre con el del banco.

  El registro está cerrado: la primera cuenta es la del dueño y el resto
  entra con un enlace de invitación de un solo uso.
