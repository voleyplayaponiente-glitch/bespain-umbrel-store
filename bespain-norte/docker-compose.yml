# App de Umbrel: Norte.
#
# Tres servicios y UNA sola puerta: nginx sirve la interfaz y pasa todo lo que
# empieza por /api al servidor, que a su vez es el único que habla con la base
# de datos. Ni el servidor ni PostgreSQL publican puerto: desde la red de casa
# solo se ve el 3012.
#
# Que la interfaz y su API compartan dirección no es un detalle de montaje: es
# lo que evita el CORS y el contenido mixto sin necesidad de HTTPS ni túneles.
services:
  web:
    image: ghcr.io/voleyplayaponiente-glitch/norte-web:latest
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - "3012:80"
    depends_on:
      - api

  api:
    image: ghcr.io/voleyplayaponiente-glitch/norte-api:latest
    restart: on-failure
    stop_grace_period: 30s
    environment:
      # La conexión va por piezas y no como URL a propósito: la contraseña la
      # genera Umbrel, y en cuanto trae una `@` o una `/` una cadena de
      # conexión se parte por el sitio equivocado. El servidor la escapa al
      # construir la URL, que es lo único que no se puede hacer desde aquí.
      NORTE_BD_HOST: db
      NORTE_BD_USUARIO: norte
      NORTE_BD_CONTRASENA: ${APP_PASSWORD}
      NORTE_BD_NOMBRE: norte
      # El secreto que firma las sesiones se deriva de la contraseña que ya
      # muestra Umbrel, así no hay nada que generar ni apuntar aparte. Va
      # repetida a propósito: Norte exige 32 caracteres como mínimo y así se
      # cumple sea cual sea el largo de la contraseña de Umbrel. Es
      # determinista, de modo que reiniciar la app no cierra la sesión de nadie.
      NORTE_SECRETO_SESION: norte-sesion-v1-${APP_PASSWORD}-${APP_PASSWORD}
      NORTE_PUERTO: 3012
      NODE_ENV: production
      NORTE_DATOS_DIR: /datos
      NORTE_COPIAS_DIR: /copias
      NORTE_COPIAS_PETICION: /peticion/copia-ahora
      # La app se sirve por http dentro de casa; exigir cookies `secure` aquí
      # impediría entrar.
      NORTE_COOKIE_SEGURA: "false"
    volumes:
      # Los documentos subidos (nóminas, extractos) viven en el disco del
      # Umbrel: actualizar la app no los toca.
      - ${APP_DATA_DIR}/documentos:/datos
      # Las copias, en SOLO LECTURA: la app las enseña en la pantalla de inicio
      # pero no puede tocarlas. Un fallo suyo no puede borrar el respaldo.
      - ${APP_DATA_DIR}/copias:/copias:ro
      # El único hueco de escritura hacia el servicio de copias: aquí deja la
      # señal el botón «Hacer una copia ahora».
      - ${APP_DATA_DIR}/peticion-copia:/peticion
    depends_on:
      db:
        condition: service_healthy

  # Copias de seguridad diarias. Es `postgres:16-alpine` con el guion dentro,
  # así que `pg_dump` es exactamente de la versión del servidor: la causa
  # número uno de volcados que fallan en montajes caseros es justo esa
  # diferencia. Las capas ya están descargadas por el servicio `db`.
  #
  # El guion va DENTRO de la imagen. Montarlo desde disco no funciona aquí:
  # umbreld solo copia `docker-compose.yml` y `umbrel-app.yml` a la carpeta de
  # la app, y resuelve las rutas relativas del compose desde SU directorio. El
  # resultado era un directorio vacío llamado `copias.sh` y un contenedor que
  # salía con código 0 sin hacer ni decir nada.
  #
  # Cada copia se comprueba antes de darse por buena y el estado se publica en
  # `copias/estado.json`, que es lo que la app enseña en la pantalla de inicio.
  # Una copia que falla en silencio es peor que no tener copias.
  copias:
    image: ghcr.io/voleyplayaponiente-glitch/norte-copias:latest
    restart: on-failure
    stop_grace_period: 30s
    environment:
      # La hora es la del contenedor: con el huso puesto, «04:30» son las 4:30
      # de la madrugada de aquí y no las 6:30, que es lo que saldría en UTC.
      TZ: Europe/Madrid
      NORTE_BD_HOST: db
      NORTE_BD_USUARIO: norte
      NORTE_BD_CONTRASENA: ${APP_PASSWORD}
      NORTE_BD_NOMBRE: norte
      NORTE_COPIAS_HORA: "04:30"
      NORTE_COPIAS_DIARIAS: "7"
      NORTE_COPIAS_MENSUALES: "12"
      # Mínimo de sitio libre que se exige en el disco externo antes de
      # escribir en él: llenarlo del todo dejaría copias a medias.
      NORTE_EXTERNO_MINIMO_MB: "500"
    volumes:
      - ${APP_DATA_DIR}/copias:/copias
      - ${APP_DATA_DIR}/documentos:/documentos:ro
      - ${APP_DATA_DIR}/peticion-copia:/peticion
      # El disco externo. Se monta la carpeta donde el sistema deja los discos
      # conectados, no un disco concreto, así vale cualquiera.
      #
      # Norte solo escribe si encuentra dentro una carpeta llamada
      # «norte-copias». Esa marca es lo único que distingue «el disco está» de
      # «el disco no está y aquí hay un directorio vacío»; sin ella el servicio
      # llenaría el disco de sistema del Umbrel creyendo que manda las copias
      # fuera. Un bind mount no ve los discos que se monten DESPUÉS de arrancar
      # el contenedor: al conectar uno hay que reiniciar la app.
      - /media:/externo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: on-failure
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: norte
      POSTGRES_PASSWORD: ${APP_PASSWORD}
      POSTGRES_DB: norte
    volumes:
      # AQUÍ viven los datos de verdad. Es el directorio que hay que respaldar.
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      # Sin esto, el servidor arranca antes que la base de datos, la migración
      # falla y el contenedor entra en bucle de reinicio.
      test: ["CMD-SHELL", "pg_isready -U norte -d norte"]
      interval: 5s
      timeout: 5s
      retries: 20
