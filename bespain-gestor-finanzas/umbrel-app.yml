gallery: []
releaseNotes: >-
  Arreglo importante: servida desde el Umbrel, la aplicación no podía leer
  NINGÚN PDF (facturas, extractos, préstamos ni acuerdos de Hacienda) porque el
  servidor web entregaba el motor de lectura con un tipo que el navegador
  rechaza. Ya se leen todos, también sin conexión. La versión 1.1.2 llevaba
  este mismo arreglo pero su imagen no llegó a publicarse.
