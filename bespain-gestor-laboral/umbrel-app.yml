gallery: []
releaseNotes: >-
  El calendario mensual por centros se puede imprimir de todos los centros o de
  uno solo, con un diseño nuevo más visual (colores por trabajador y por centro,
  leyenda y totales). La ficha de alta en Excel sigue ahora el formulario de
  contratación del despacho, y al importarla asigna el centro y calcula el
  salario mensual y el fin del periodo de prueba.
