description: >-
  Planifica cuadrantes mensuales por trabajador y por centro, calcula horas y
  retribuciones (IRPF y Seguridad Social), controla vacaciones y horas
  complementarias, emite avisos laborales y exporta el registro de jornada
  firmado en PDF y Excel. Todo local y privado: los datos no salen del Umbrel.
developer: BESPAIN
