id: bespain-gestor-laboral
name: Gestor Laboral
tagline: Cuadrantes y control de horas del personal
icon: https://raw.githubusercontent.com/voleyplayaponiente-glitch/clauderoutine/refs/heads/claude/labor-management-scheduling-app-jd2hcj/src/renderer/public/icon-512.png
